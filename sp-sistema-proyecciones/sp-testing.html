<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Malla Curricular - Testing</title>
  <link rel="stylesheet" href="../css/style-mallas.css">
  <style>
    body { font-family: Arial, sans-serif; padding: 2rem; }
    .container { max-width: 1200px; margin: 0 auto; }
    .resultado { background: #f5f5f5; padding: 1rem; border-radius: 4px; margin-top: 2rem; }
    pre { background: #fff; padding: 1rem; border: 1px solid #ddd; overflow-x: auto; }
    .error { color: red; }
    .success { color: green; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Malla Curricular - Testing</h1>
      <p>Página de prueba para los módulos de proyección</p>
    </header>

    <main>
      <section>
        <h2>Contenedor de Malla</h2>
        <div id="contenedorMalla"></div>
      </section>

      <section class="resultado">
        <h2>Resultado de Proyección</h2>
        <div id="resultadoProyeccion">
          <p>Esperando ejecución...</p>
        </div>
      </section>
    </main>
  </div>

  <script src="../sp-sistema-proyecciones/sp-mallas-api.js"></script>
  <script src="../sp-sistema-proyecciones/sp-proyeccion-validator.js"></script>
  <script src="../sp-sistema-proyecciones/sp-proyeccion-processor.js"></script>
  <script src="../sp-sistema-proyecciones/sp-proyeccion-builder.js"></script>
  <script src="../sp-sistema-proyecciones/sp-proyeccion-app.js"></script>
  <script src="../sp-sistema-proyecciones/sp-historico-avance-api.js"></script>
  <script src="../sp-sistema-proyecciones/sp-proyeccion.js"></script>
</body>
</html>
