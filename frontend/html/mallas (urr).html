<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Malla Curricular</title>
  <link rel="icon" type="image/png" href="../images/favicon.png">
  <link rel="stylesheet" href="../css/style-mallas.css">
</head>
<body>
  <header class="cabecera-malla">
    <div>
      <h1>Malla Curricular</h1>
      <p>Visualiza tu avance y genera simulaciones rápidas</p>
    </div>
  </header>

  <div id="selectorCarreraMallaContainer" style="display:none;margin:1rem;padding:0.75rem;background:var(--surface, #fff);border:1px solid var(--border, #ddd);border-radius:8px">
    <label for="selectCarreraMalla" style="display:block;margin-bottom:0.5rem;font-weight:600;color:var(--text, #333)">Carrera:</label>
    <select id="selectCarreraMalla" style="padding:0.5rem;min-width:200px;border:1px solid var(--border, #ddd);border-radius:6px;background:var(--surface, #fff);color:var(--text, #333);cursor:pointer">
      <option value="">-- Seleccionar carrera --</option>
    </select>
  </div>

  <main id="contenedorMalla"></main>
  <script src="../js/mallas-api.js"></script>
  <script src="../js/mallas-ui.js"></script>
  <script src="../js/mallas.js"></script>
</body>
</html>
