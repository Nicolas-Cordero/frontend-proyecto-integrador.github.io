<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Simulación Próximo Semestre</title>
  <link rel="stylesheet" href="../css/main-menu.css">
  <link rel="stylesheet" href="../css/style-mallas.css">
  <link rel="stylesheet" href="../css/simulacion-prox-semestre.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <section style="padding:1.5rem">
    <header style="margin-bottom:1rem">
      <h1>Simulación Próximo Semestre</h1>
      <p style="color:var(--muted)">Genera una simulación basada en tu información académica actual.</p>
    </header>

    <div class="panel" style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1rem;margin-bottom:1.5rem">
      <div id="selectorCarreraContainer" style="display:none;margin-bottom:1rem;padding:0.75rem;background:var(--background);border:1px solid var(--border);border-radius:8px">
        <label for="selectCarreraSimulacion" style="display:block;margin-bottom:0.5rem;font-weight:600;color:var(--text)">Carrera:</label>
        <select id="selectCarreraSimulacion" style="padding:0.5rem;min-width:200px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--text);cursor:pointer">
          <option value="">-- Seleccionar carrera --</option>
        </select>
      </div>
      <h2 style="margin-bottom:0.75rem;font-size:1.1rem">Ramos Adelantables</h2>
      <p style="color:var(--muted);margin-bottom:1rem;font-size:0.9rem">Selecciona los ramos que deseas adelantar en el próximo semestre:</p>
      <div id="ramosCounter" class="ramos-counter" style="display:none">
        <i class="fa-solid fa-check-circle"></i>
        <span>Ramos seleccionados: <span class="count">0</span></span>
      </div>
      <div id="ramosAdelantablesContainer" style="max-height:400px;overflow-y:auto;border:1px solid var(--border);border-radius:8px;padding:1rem;background:var(--background)">
        <p style="color:var(--muted);text-align:center">Cargando ramos disponibles...</p>
      </div>
    </div>

    <div class="panel" style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1rem">
      <div style="display:flex;gap:0.75rem;align-items:center;justify-content:flex-start">
        <button id="botonProbarSimulacion" class="boton-simulacion">
          <i class="fa-solid fa-flask"></i>
          <span>Generar Simulación</span>
        </button>
        <span id="estadoSimulacion" style="color:var(--muted)">Listo para generar</span>
      </div>
      <div id="resultadoSimulacion" style="margin-top:1rem;color:var(--text)"></div>
    </div>
  </section>

  <script src="../js/proyeccion-validador.js"></script>
  <script src="../js/proyeccion-procesador.js"></script>
  <script src="../js/mallas-api.js"></script>
  <script src="../js/simulacion-prox-semestre.js"></script>
</body>
</html>
