<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mis simulaciones</title>

  <link rel="stylesheet" href="../css/mis-simulaciones.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Mis simulaciones</h1>
      <p class="hint">Selecciona una simulación para ver su proyección</p>
    </header>

    <main>
      <aside class="panel" aria-labelledby="panel-title">
        <h2 id="panel-title" class="visually-hidden">Panel de selección</h2>

        <div class="panel-controls">
          <div class="select-wrapper">
            <label for="simulaciones">Elige una simulación</label>
            <select id="simulaciones" aria-describedby="sim-status">
              <option value="">— Cargando opciones —</option>
            </select>
          </div>

          <div class="actions">
            <button id="iniciarFetch" aria-label="Ver simulación seleccionada">
              <i class="fa-solid fa-eye"></i>
              <span>Ver simulación</span>
            </button>
            <button id="descargarSimulacion" aria-label="Descargar JSON de simulación seleccionada" disabled>
              <i class="fa-solid fa-download"></i>
              <span>Descargar JSON</span>
            </button>
            <button id="borrarSimulacion" aria-label="Borrar simulación seleccionada" disabled>
              <i class="fa-solid fa-trash"></i>
              <span>Borrar</span>
            </button>
          </div>
        </div>

        <div id="Datos" class="hint" aria-live="polite">Sin selección</div>
      </aside>

      <section id="contenedorMalla" class="contenedorMalla" aria-live="polite" tabindex="0">
        <div class="empty">Selecciona una simulación en el panel para verla aquí.</div>
      </section>
    </main>
  </div>

  <script src="../js/poblar-simulaciones.js"></script>
  <script src="../js/mis-simulaciones.js"></script>
  <script src="../js/proyeccion-ui.js"></script>

</body>
</html>
