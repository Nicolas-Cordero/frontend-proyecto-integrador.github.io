<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Malla Curricular - Testing</title>
  <link rel="stylesheet" href="../css/style-mallas.css">
  <style>
    body { 
      font-family: Arial, sans-serif; 
      padding: 2rem; 
      background: var(--bg-primary, #ffffff);
      color: var(--text-primary, #000000);
    }
    .container { 
      max-width: 1200px; 
      margin: 0 auto; 
    }
    header {
      margin-bottom: 2rem;
    }
    header h1 {
      margin: 0 0 0.5rem 0;
      font-size: 2rem;
    }
    header p {
      margin: 0;
      color: var(--text-muted, #666666);
    }
    main {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2rem;
    }
    section {
      border: 1px solid var(--border-color, #ddd);
      border-radius: 8px;
      padding: 1.5rem;
      background: var(--bg-secondary, #f9f9f9);
    }
    section h2 {
      margin-top: 0;
      margin-bottom: 1rem;
      font-size: 1.25rem;
    }
    .resultado { 
      background: var(--bg-secondary, #f5f5f5); 
      padding: 1.5rem; 
      border-radius: 8px; 
      grid-column: 1 / -1;
    }
    pre { 
      background: var(--bg-code, #fff); 
      padding: 1rem; 
      border: 1px solid var(--border-color, #ddd); 
      overflow-x: auto;
      border-radius: 4px;
      max-height: 500px;
      overflow-y: auto;
    }
    .error { 
      color: #ef4444; 
      font-weight: 600;
    }
    .success { 
      color: #22c55e; 
      font-weight: 600;
    }
    #contenedorMalla {
      min-height: 200px;
    }
    @media (max-width: 768px) {
      main {
        grid-template-columns: 1fr;
      }
      .resultado {
        grid-column: 1;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Malla Curricular - Testing</h1>
      <p>Página de prueba para los módulos de proyección</p>
    </header>

    <main>
      <section>
        <h2>Contenedor de Malla</h2>
        <div id="contenedorMalla"></div>
      </section>

      <section class="resultado">
        <h2>Resultado de Proyección</h2>
        <div id="resultadoProyeccion">
          <p>Esperando ejecución...</p>
        </div>
      </section>
    </main>
  </div>

  <script src="../js/mallas-api.js"></script>
  <script src="../js/proyeccion-validador.js"></script>
  <script src="../js/proyeccion-procesador.js"></script>
  <script src="../js/proyeccion-constructor.js"></script>
  <script src="../js/proyeccion-app.js"></script>
  <script src="../js/historico-avance-api.js"></script>
  <script>
    async function ejecutar() {
      const resultDiv = document.getElementById('resultadoProyeccion');
      
      try {
        console.log('🧪 Iniciando proyección de testing...');
        resultDiv.innerHTML = '<p class="success">⏳ Ejecutando prueba...</p>';
        
        if (typeof window.prepararProyeccion !== 'function') {
          throw new Error('La función prepararProyeccion no está disponible');
        }
        
        console.log('Llamando a prepararProyeccion...');
        const proyeccion = await window.prepararProyeccion(
          '222222222',
          '8266',
          '202410',
          30
        );

        console.log('Proyección completada:', proyeccion);
        
        resultDiv.innerHTML = `
          <h3 class="success" Proyección generada exitosamente</h3>
          <pre>${JSON.stringify(proyeccion, null, 2)}</pre>
        `;
      } catch (error) {
        console.error('Error en la proyección:', error);
        resultDiv.innerHTML = `
          <h3 class="error">Error en la proyección:</h3>
          <pre class="error">${error.message}\n\nStack: ${error.stack}</pre>
          <p>Verifica la consola del navegador (F12) para más detalles.</p>
        `;
      }
    }

    console.log('Documento cargando...');
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', () => {
        console.log(' DOM cargado, ejecutando proyección...');
        ejecutar();
      });
    } else {
      console.log('DOM ya está listo, ejecutando proyección...');
      ejecutar();
    }
  </script>
</body>
</html>
